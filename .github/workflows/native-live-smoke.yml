name: Native session throughput experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux-live-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      AI_SEARCH_OVERVIEW_CACHE: /tmp/overview-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev libfontconfig1-dev libfreetype6-dev
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build pinned native runtime
        run: node dist/cli.js setup --python python3
      - name: Check session expiry and scope offline
        run: /tmp/overview-runtime/python/bin/python -m unittest discover -s scripts/test-support -p 'test_session_fetch.py'
      - name: Observe up to 100 fresh searches over ten minutes
        run: node scripts/session-throughput-smoke.mjs
